title = "Portifolio Security Config"

# Allowlist restrita a fixtures de teste e codigo vendorizado.
# NUNCA adicionar src/ ou docs/: um segredo real em codigo ou documentacao
# DEVE falhar o scan (docs/.* ja foi allowlistado e cegava o gitleaks).
[allowlist]
description = "Test fixtures and vendored node_modules only"
paths = ['''test/.*''', '''node_modules/.*''']

[[rules]]
id = "audio-files"
description = "Audio transcription files should not be committed"
regex = '''audio_[a-f0-9]+\.(json|srt|tsv|txt|vtt|ogg|wav|mp3)$'''
tags = ["audio", "transcription"]

[[rules]]
id = "screenshots"
description = "Screenshots should not be in repos"
regex = '''(screenshot|print|captura|snapshot)\.(png|jpg|jpeg|gif)$'''
tags = ["media", "screenshot"]
