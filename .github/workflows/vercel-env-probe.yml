name: Vercel Env Probe

# Workflow de diagnostico: confere se o VERCEL_TOKEN do GitHub Secrets
# consegue ler/escrever env vars do projeto. Nao altera nada por padrao.
# Criado 09/11/2026 para desbloquear o AdSense sem depender de token local.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -u
          echo "ORG_ID len=${#VERCEL_ORG_ID}  PROJECT_ID len=${#VERCEL_PROJECT_ID}"
          echo "--- user ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user | head -c 160; echo
          echo "--- projeto ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '"name=\(.name // "?") err=\(.error.code // "-")"'
          echo "--- envs AdSense ---"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" > /tmp/envs.json
          jq -r '(.envs // []) | length | "total envs: \(.)"' /tmp/envs.json
          jq -r '(.envs // [])[] | select(.key|test("ADSENSE";"i")) | "  \(.key) target=\(.target|tostring)"' /tmp/envs.json
          echo "--- erro se houver ---"
          jq -r '.error.message // "sem erro"' /tmp/envs.json

      - name: Gravar resumo no log do job
        if: always()
        run: echo "Probe concluido. Veja as linhas acima no log deste step."
