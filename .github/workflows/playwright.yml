name: E2E Tests — Playwright

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Atualizar snapshots visuais (gera PNGs no ambiente do CI e commita)'
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Usa o pnpm do packageManager (hoje pnpm@10.34.5) — fix 02/08/2026
          version: 10.34.5

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium

      - name: Build Next.js
        run: pnpm build
        env:
          CI: true

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        if: inputs.update_snapshots != true
        run: pnpm test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      - name: Update visual snapshots (ambiente CI)
        if: inputs.update_snapshots == true && matrix.shardIndex == 1
        run: pnpm exec playwright test tests/visual.spec.ts --update-snapshots --project=chromium
        env:
          CI: true

      - name: Commit updated snapshots
        if: inputs.update_snapshots == true && matrix.shardIndex == 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca nos snapshots"
          else
            git commit -m "test(e2e): atualiza snapshots visuais gerados no ambiente do CI"
            git push
          fi
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
