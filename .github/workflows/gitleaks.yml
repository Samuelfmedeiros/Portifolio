name: 🔑 Gitleaks Secret Scan

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC

jobs:
  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # ⚠️ GITLEAKS_LICENSE (22/11/2026): a gitleaks-action pode exigir licença
          # para org/uso corporativo. Se a secret nao estiver configurada no repo,
          # este gate bloqueante falha por CONFIGURACAO, nao por achado.
          # Acao do dono: confirmar a secret GITLEAKS_LICENSE no GitHub ou trocar a
          # action pelo binario gitleaks OSS. Detalhes em CHECKPOINT-GITLEAKS-LICENSE-2026-11-22.md.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
