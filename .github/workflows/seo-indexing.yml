name: SEO — indexacao (IndexNow)

# Roda DEPOIS do deploy de producao (workflow_run do Portifolio CI/CD) e
# submete as URLs do sitemap para os buscadores do protocolo IndexNow: Bing,
# Yandex, Seznam, Naver. O Google NAO consome IndexNow — para ele a descoberta
# vem do sitemap.xml declarado no robots.txt + Search Console.
#
# Idempotente e seguro: nenhuma URL privada/admin e submetida.

on:
  workflow_run:
    workflows: ['Portifolio CI/CD']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-indexing
  cancel-in-progress: false

jobs:
  indexnow:
    name: Submeter sitemap ao IndexNow
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEXNOW_HOST: samuelmedeiros.vercel.app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Esperar o site responder 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$INDEXNOW_HOST/" || true)
            if [ "$code" = "200" ]; then
              echo "site no ar (tentativa $i)"
              exit 0
            fi
            sleep 10
          done
          echo "site nao respondeu 200 em 5 min"
          exit 1

      - name: Submeter URLs ao IndexNow
        run: node scripts/indexnow-submit.mjs
