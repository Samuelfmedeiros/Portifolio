name: 🔒 Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday 06:00 UTC

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        # Binario OSS gitleaks v8.28.0 — SHA-256 fixado; substitui a action
        # que exigia licenca paga. Sem token interpolado no scan.
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --exit-code 1 .
  bandit-opengrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install bandit + opengrep
        run: |
          pip install bandit
          curl -sL https://github.com/opengrep/opengrep/releases/download/v1.26.0/opengrep_manylinux_x86 -o /usr/local/bin/opengrep
          chmod +x /usr/local/bin/opengrep
      - name: Bandit scan (se houver Python)
        run: |
          if find . -name "*.py" -not -path "*/node_modules/*" | grep -q .; then
            bandit -q -r . -x "*/tests/*,*/node_modules/*" --severity-level medium
          else
            echo "Sem arquivos Python — pulando bandit"
          fi
      - name: Opengrep scan (regras custom)
        run: |
          if [ -f .security/opengrep-rules.yml ]; then
            opengrep --config .security/opengrep-rules.yml .
          else
            echo "Sem regras custom (.security/opengrep-rules.yml) — pulando opengrep"
          fi
